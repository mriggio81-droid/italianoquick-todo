<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ItalianoQuick — Checklist Sito</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #E8344E;
    --red-dark: #C02840;
    --red-light: #fdeef1;
    --yellow: #F5A623;
    --yellow-light: #fff8ed;
    --green: #2D9E6B;
    --green-light: #edf7f3;
    --dark: #1a1a2e;
    --mid: #4a4a6a;
    --muted: #8a8aa0;
    --light: #f7f7fc;
    --white: #ffffff;
    --border: #e8e8f0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--light);
    color: var(--dark);
    min-height: 100vh;
    padding-bottom: 60px;
  }
  header {
    background: var(--dark);
    padding: 44px 24px 34px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 220px; height: 220px;
    background: var(--red);
    border-radius: 50%;
    opacity: 0.15;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -40px; left: 40px;
    width: 140px; height: 140px;
    background: var(--yellow);
    border-radius: 50%;
    opacity: 0.12;
  }
  .header-inner { max-width: 880px; margin: 0 auto; position: relative; z-index: 1; }
  header h1 {
    font-family: 'Playfair Display', serif;
    color: var(--white);
    font-size: 2.1rem;
    margin-bottom: 6px;
  }
  header p { color: #c7c7de; font-size: 0.95rem; }
  .updated { color: var(--yellow); font-size: 0.8rem; margin-top: 10px; }

  .progress-wrap { max-width: 880px; margin: -22px auto 0; padding: 0 24px; position: relative; z-index: 2; }
  .progress-card {
    background: var(--white);
    border-radius: 14px;
    padding: 18px 22px;
    box-shadow: 0 8px 24px rgba(26,26,46,0.12);
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .progress-bar-track {
    flex: 1;
    height: 10px;
    background: var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), #58c99a);
    border-radius: 6px;
    transition: width 0.4s ease;
  }
  .progress-label { font-size: 0.85rem; color: var(--mid); white-space: nowrap; font-weight: 500; }

  main { max-width: 880px; margin: 34px auto 0; padding: 0 24px; }

  .section { margin-bottom: 32px; }
  .section-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 14px;
  }
  .section-head h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
  }
  .section-count { font-size: 0.8rem; color: var(--muted); }
  .section.alta .section-head h2 { color: var(--red-dark); }
  .section.media .section-head h2 { color: #b57a10; }
  .section.bassa .section-head h2 { color: #1f7a4f; }

  .item {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  .item.done { background: var(--green-light); opacity: 0.75; }
  .item input[type="checkbox"] {
    margin-top: 3px;
    width: 18px;
    height: 18px;
    accent-color: var(--green);
    flex-shrink: 0;
    cursor: pointer;
  }
  .item-text { flex: 1; }
  .item-title { font-size: 0.95rem; font-weight: 500; line-height: 1.4; }
  .item.done .item-title { text-decoration: line-through; color: var(--muted); }
  .item-note { font-size: 0.82rem; color: var(--mid); margin-top: 3px; line-height: 1.4; }
  .item.done .item-note { color: var(--muted); }

  footer { max-width: 880px; margin: 30px auto 0; padding: 0 24px; text-align: center; }
  footer p { font-size: 0.8rem; color: var(--muted); }
  .reset-btn {
    margin-top: 14px;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.78rem;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .reset-btn:hover { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>ItalianoQuick — Checklist Sito</h1>
    <p>Voci ancora aperte e chiuse dall'audit del sito, aggiornate al 21 ottobre 2026</p>
    <div class="updated">Le spunte si salvano solo su questo browser</div>
  </div>
</header>

<div class="progress-wrap">
  <div class="progress-card">
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0 completate</div>
  </div>
</div>

<main>

  <div class="section alta" id="section-alta">
    <div class="section-head"><h2>🔴 Alta priorità</h2><span class="section-count"></span></div>
    <div class="items"></div>
  </div>

  <div class="section media" id="section-media">
    <div class="section-head"><h2>🟡 Media priorità</h2><span class="section-count"></span></div>
    <div class="items"></div>
  </div>

  <div class="section bassa" id="section-bassa">
    <div class="section-head"><h2>🟢 Bassa priorità</h2><span class="section-count"></span></div>
    <div class="items"></div>
  </div>

</main>

<footer>
  <p>ItalianoQuick — checklist interna</p>
  <button class="reset-btn" onclick="if(confirm('Cancellare tutte le spunte?')){localStorage.removeItem('iq-sito-todo-v2');location.reload();}">Azzera spunte</button>
</footer>

};

const STORAGE_KEY = 'iq-sito-todo-v2';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function render() {
  const state = loadState();
  let totalItems = 0, totalDone = 0;

  ['alta', 'media', 'bassa'].forEach(key => {
    const container = document.querySelector(`#section-${key} .items`);
    const countEl = document.querySelector(`#section-${key} .section-count`);
    container.innerHTML = '';
    let sectionDone = 0;

    DATA[key].forEach(item => {
      const isDone = state.hasOwnProperty(item.id) ? state[item.id] : item.done;
      totalItems++;
      if (isDone) { totalDone++; sectionDone++; }

      const div = document.createElement('div');
      div.className = 'item' + (isDone ? ' done' : '');
      div.innerHTML = `
        <input type="checkbox" ${isDone ? 'checked' : ''} data-id="${item.id}">
        <div class="item-text">
          <div class="item-title">${item.title}</div>
          ${item.note ? `<div class="item-note">${item.note}</div>` : ''}
        </div>
      `;
      container.appendChild(div);
    });

    countEl.textContent = `${sectionDone} / ${DATA[key].length}`;
  });

  document.getElementById('progressLabel').textContent = `${totalDone} / ${totalItems} completate`;
  document.getElementById('progressFill').style.width = totalItems ? `${(totalDone/totalItems)*100}%` : '0%';

  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const state = loadState();
      state[e.target.dataset.id] = e.target.checked;
      saveState(state);
      render();
    });
  });
}

render();
</script>

</body>
</html>
